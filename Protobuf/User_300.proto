syntax = "proto3";
package User;
option module = 300;
// 请求账号登录
message ReqLogin
{
  int64  Id =1;
  string Platform = 2;   // 平台标识 (steam, android, ios, windows)
  int32 SdkType = 3;     // SDK 类型 (0: 官方, 1: Steam, 2: 微信...)
  string SdkToken = 4;   // 登录凭证 (Steam Session Ticket)
  string Device = 5;     // 设备唯一标识 (用于封禁或追踪)
  string Password = 6;   // 密码 (非第三方登录时使用)
  string DeviceModel = 7; // [补全] 设备型号 (如: RTX 4090, iPhone 15)
  string Version = 8;    // [补全] 客户端版本号 (用于版本强制更新检查)
string UserName = 9;   // 账号名 (SteamID / 手机号 / 自定义账号)

}

// 请求账号登录返回
message RespLogin
{
  int64 Id = 1;        
  string RoleName = 2; 
int32 Code = 3;       
  uint32 Level = 4;      
  int64 CreateTime = 5; 
  string Token = 6;     
  string ServerTime = 7; 
}

// 请求角色创建
message ReqPlayerCreate
{
  int64 Id = 1; // 账号ID  
  string Name = 2; // 角色名
}

// 请求角色创建返回
message RespPlayerCreate
{
   PlayerInfo PlayerInfo = 1; // 角色信息
}

// 请求角色列表
message ReqPlayerList
{
  int64 Id = 1; // 账号ID
}
// 请求角色列表返回
message RespPlayerList
{
  repeated PlayerInfo PlayerList = 1; // 角色列表
}

message PlayerInfo
{
  int64 Id = 1; // 角色ID
  string Name = 2; // 角色名
  uint32 Level = 3; // 角色等级
  int32 State = 4; // 角色状态
  uint32 Avatar = 5; // 角色头像
  uint64 CurrentExp = 6; // 角色当前经验
}


// 请求玩家登录
message ReqPlayerLogin
{
  string UserName = 9;   // 账号名 (SteamID / 手机号 / 自定义账号)
  string Platform = 2;   // 平台标识 (steam, android, ios, windows)
  int32 SdkType = 3;     // SDK 类型 (0: 官方, 1: Steam, 2: 微信...)
  string SdkToken = 4;   // 登录凭证 (Steam Session Ticket)
  string Device = 5;     // 设备唯一标识 (用于封禁或追踪)
  string Password = 6;   // 密码 (非第三方登录时使用)
  string DeviceModel = 7; // [补全] 设备型号 (如: RTX 4090, iPhone 15)
  string Version = 8;    // [补全] 客户端版本号 (用于版本强制更新检查)
  int64  Id =1;
}

// 请求玩家登录返回
message RespPlayerLogin
{
  int32 Code = 1;
  int64 CreateTime = 2; // 创建时间  
  PlayerInfo PlayerInfo = 3; // 角色信息
}

// 客户端每次请求都会回复错误码
message RespErrorCode
{
  int64 ErrCode = 1; // 0:表示无错误
  string Desc = 2; // 错误描述（不为0时有效）
}

message RespPrompt
{
  int32 Type = 1; // 提示信息类型（1Tip提示，2跑马灯，3插队跑马灯，4弹窗，5弹窗回到登陆，6弹窗退出游戏）
  string Content = 2; // 提示内容
}

//请求玩家参数
message ReqPlayerInfo
{
  int64 PlayerId = 1;
}

message RespPlayerInfo
{
  PlayerInfo PlayerInfo = 1;
}

//请求玩家宠物数据
message ReqPlayerPet
{
  int64 PlayerId = 1;
}

// 请求开始匹配
message ReqMatchStart
{
}

// 请求开始匹配返回
message RespMatchStart
{
  bool IsMatching = 1; // 是否已进入匹配队列
  int32 QueueCount = 2; // 当前匹配队列人数
  int64 RoomId = 3; // 当前房间ID，未匹配成功时为0
}

// 请求取消匹配
message ReqMatchCancel
{
}

// 请求取消匹配返回
message RespMatchCancel
{
  bool IsCancelled = 1; // 是否取消成功
  int32 QueueCount = 2; // 当前匹配队列人数
}

// 房间玩家信息
message MatchRoomPlayerInfo
{
  int64 PlayerId = 1; // 玩家ID
  string Name = 2; // 玩家名称
  uint32 Level = 3; // 玩家等级
  uint32 Avatar = 4; // 玩家头像
  bool IsReady = 5; // 是否已准备
}

// 匹配成功通知
message NotifyMatchSuccess
{
  int64 RoomId = 1; // 房间ID
  repeated MatchRoomPlayerInfo PlayerList = 2; // 房间玩家列表
}

// 请求房间准备
message ReqMatchRoomReady
{
  bool IsReady = 1; // 是否准备
}

// 请求房间准备返回
message RespMatchRoomReady
{
  int64 RoomId = 1; // 房间ID
  bool IsReady = 2; // 当前玩家是否准备
  repeated MatchRoomPlayerInfo PlayerList = 3; // 房间玩家列表
}

// 房间状态变更通知
message NotifyMatchRoomChanged
{
  int64 RoomId = 1; // 房间ID
  repeated MatchRoomPlayerInfo PlayerList = 2; // 房间玩家列表
}
